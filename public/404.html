<!doctype html>
<html lang="tr">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1.0">
<title>Sayfa Bulunamadı — DAĞ S.K.</title>
<meta name="robots" content="noindex">
<link rel="icon" href="/favicon.png">
<link href="https://fonts.googleapis.com/css2?family=Poppins:wght@400;700;800;900&display=swap" rel="stylesheet">
<style>
  :root{ --bg:#0a0a0c; --ink:#f5f5f6; --ink-soft:#9a9aa3; --line:rgba(255,255,255,0.10); --accent:#ff6a1a; --accent-2:#ffd166; }
  *{box-sizing:border-box; margin:0;}
  body{
    background:var(--bg); color:var(--ink); font-family:'Poppins',-apple-system,sans-serif;
    min-height:100vh; display:flex; flex-direction:column; align-items:center; justify-content:center;
    text-align:center; padding:30px;
  }
  img{ height:56px; margin-bottom:28px; filter:drop-shadow(0 6px 16px rgba(255,106,26,0.3)); }
  .kod{
    font-size:clamp(70px,14vw,120px); font-weight:900; line-height:1;
    background-image:linear-gradient(120deg,#ffb36b,var(--accent),var(--accent-2));
    -webkit-background-clip:text; background-clip:text; color:transparent;
  }
  h1{ font-size:clamp(18px,3vw,24px); font-weight:800; margin:14px 0 8px; }
  p{ color:var(--ink-soft); font-size:14.5px; max-width:44ch; margin-bottom:30px; }
  a{
    background:linear-gradient(135deg,var(--accent),#ff8c42); color:#0a0a0c; text-decoration:none;
    font-weight:800; font-size:14px; padding:14px 28px; border-radius:12px;
    box-shadow:0 12px 30px rgba(255,106,26,0.3);
  }
</style>
</head>
<body>
  <img src="/tanitim-logo.png" alt="DAĞ S.K.">
  <div class="kod">404</div>
  <h1>Bu sayfa hedefi ıskaladı 🎯</h1>
  <p>Aradığın sayfa taşınmış ya da hiç var olmamış olabilir. Ama merak etme, doğru yönü biliyoruz.</p>
  <a href="/">Ana Sayfaya Dön</a>
</body>
</html>
