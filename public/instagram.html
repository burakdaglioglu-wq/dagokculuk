<!doctype html>
<html lang="tr">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width,initial-scale=1">
<meta name="robots" content="noindex">
<title>Instagram Bağlantısı</title>
<style>
:root{--zemin:#170803;--kart:#2A1208;--yazi:#FFF1E6;--soluk:#D6A88A;--turuncu:#FD8E01;--yesil:#4ade80;--kirmizi:#f87171}
*{box-sizing:border-box}
body{margin:0;min-height:100vh;display:grid;place-items:center;background:var(--zemin);color:var(--yazi);font-family:system-ui,-apple-system,sans-serif;padding:16px}
.k{width:min(460px,100%);background:var(--kart);border-radius:20px;padding:26px;box-shadow:inset 0 0 0 1.5px rgba(253,142,1,.3)}
h1{font-size:22px;margin:0 0 6px}p{color:var(--soluk);line-height:1.5;margin:8px 0}
.d{margin:16px 0;padding:14px;border-radius:14px;background:rgba(255,241,230,.06);font-weight:700}
.d.iyi{color:var(--yesil)}.d.kotu{color:var(--kirmizi)}
button,a.b{display:block;width:100%;min-height:52px;margin-top:10px;border:0;border-radius:14px;font:inherit;font-weight:800;font-size:16px;cursor:pointer;text-align:center;line-height:52px;text-decoration:none}
.ana{background:linear-gradient(135deg,#FD8E01,#FC5B01);color:#1A0700}
.ikinci{background:transparent;color:var(--yazi);box-shadow:inset 0 0 0 1.5px rgba(253,142,1,.35)}
button:disabled{opacity:.5;cursor:default}
small{display:block;color:var(--soluk);margin-top:14px;font-size:12.5px;line-height:1.5}
</style>
</head>
<body>
<div class="k">
  <h1>📸 Instagram Bağlantısı</h1>
  <p>Kulübün Instagram hesabını uygulamaya bağlar. Şifren istenmez; Facebook'un kendi izin penceresi açılır.</p>
  <div class="d" id="durum">Kontrol ediliyor…</div>
  <div id="eylem"></div>
  <small>Anahtarlar yalnızca sunucuda saklanır, hiçbir ekranda gösterilmez. Hiçbir şey senin onayın olmadan paylaşılmaz.</small>
</div>
<script>
(function () {
  var tok = null;
  try { tok = localStorage.getItem('dag_oturum') || sessionStorage.getItem('dag_oturum'); } catch (e) {}
  var durum = document.getElementById('durum'), eylem = document.getElementById('eylem');
  function yaz(t, cls) { durum.textContent = t; durum.className = 'd' + (cls ? ' ' + cls : ''); }
  function api(yol, opt) {
    opt = opt || {}; opt.headers = Object.assign({ 'content-type': 'application/json' }, opt.headers || {}, tok ? { 'X-Dagsk-Oturum': tok } : {});
    return fetch(yol, opt).then(function (r) { return r.json().catch(function () { return {}; }).then(function (d) { d._s = r.status; return d; }); });
  }
  function tarih(t) { try { return new Date(t).toLocaleDateString('tr-TR', { day: 'numeric', month: 'long', year: 'numeric' }); } catch (e) { return ''; } }
  if (!tok) {
    yaz('Bu tarayıcıda uygulamaya giriş yapılmamış.', 'kotu');
    eylem.innerHTML = '<a class="b ana" href="/app.html">Uygulamaya giriş yap</a><button class="ikinci" onclick="location.reload()">Giriş yaptım, yenile</button>';
    return;
  }
  api('/api/instagram/durum').then(function (d) {
    if (d._s === 401) { yaz('Oturum süresi dolmuş. Uygulamaya yeniden giriş yap.', 'kotu'); eylem.innerHTML = '<a class="b ana" href="/app.html">Uygulamaya git</a>'; return; }
    if (d.bagli) {
      var kalan = d.bitis ? Math.round((d.bitis - Date.now()) / 86400000) : null;
      yaz('✅ Bağlı: @' + (d.kullanici || '?') + ' · ' + (d.sayfa || '') + ' · ' + tarih(d.tarih) + (kalan != null ? ' · ' + kalan + ' gün geçerli' : ''), 'iyi');
      eylem.innerHTML = '<button class="ikinci" id="yeniden">Yeniden bağla</button><button class="ikinci" id="kes">Bağlantıyı kes</button>';
      document.getElementById('kes').onclick = function () {
        if (!confirm('Instagram bağlantısı kesilsin mi?')) return;
        api('/api/instagram/kes', { method: 'POST', body: '{}' }).then(function () { location.reload(); });
      };
    } else {
      yaz(d.sayfa ? 'Sayfa bağlı ama Instagram hesabı bulunamadı. Yeniden bağla.' : 'Henüz bağlı değil.', d.sayfa ? 'kotu' : '');
      eylem.innerHTML = '<button class="ana" id="yeniden">Instagram\'ı bağla</button>';
    }
    document.getElementById('yeniden').onclick = function () {
      var b = this; b.disabled = true; b.textContent = 'Facebook açılıyor…';
      api('/api/instagram/baslat', { method: 'POST', body: '{}' }).then(function (r) {
        if (r.url) { location.href = r.url; return; }
        b.disabled = false; b.textContent = 'Tekrar dene';
        yaz(r.error === 'yonetici-gerekli' ? 'Bunu yalnızca yönetici yapabilir.' : r.error === 'ayar-eksik' ? 'Sunucuda Meta uygulama ayarı eksik (App Secret).' : 'Başlatılamadı: ' + (r.error || r._s), 'kotu');
      });
    };
  }).catch(function () { yaz('Sunucuya ulaşılamadı.', 'kotu'); });
})();
</script>
</body>
</html>
