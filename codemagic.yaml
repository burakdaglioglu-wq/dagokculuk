# DAĞ SK telefon uygulaması — Codemagic otomatik derleme (Mac gerekmez; derleme Codemagic'in Mac'inde).
# Uygulama canlı siteyi açar (mobil/capacitor.config.json → https://dagsporkulubu.com/app): site güncellemeleri
# yeni derleme GEREKTİRMEZ. Yeni derleme yalnız şunlar için: TestFlight sürümü 90 günde dolar · izin/ikon/yerel ayar değişti.
#
# Bir kez kurulacaklar (Codemagic arayüzü):
#  1) Team settings › Integrations › Developer Portal: App Store Connect API anahtarı ekle, adını "DAG_ASC" koy
#     (App Store Connect › Users and Access › Integrations › App Store Connect API, rol: App Manager).
#  2) App Store Connect'te uygulamayı oluştur (bundle id com.dagsporkulubu.app); uygulamanın Apple ID numarasını
#     aşağıdaki APP_STORE_APPLE_ID yerine yaz. TestFlight'ta "Kulüp" adlı dış test grubu aç, Public Link'i etkinleştir.
#  3) Team settings › Code signing identities › Android keystores: mobil/imza/dagsk-android.jks yükle, referans adı
#     "dag_keystore" (şifre ve alias mobil/imza/anahtar.properties içinde).
#  4) İsteğe bağlı: iOS iş akışına 60 günde bir zamanlanmış derleme (TestFlight 90 gün sınırı dolmasın).

workflows:
  ios-testflight:
    name: iPhone → TestFlight
    instance_type: mac_mini_m2
    max_build_duration: 45
    integrations:
      app_store_connect: DAG_ASC
    environment:
      ios_signing:
        distribution_type: app_store
        bundle_identifier: com.dagsporkulubu.app
      vars:
        APP_STORE_APPLE_ID: 0000000000   # App Store Connect › Uygulama › App Information › Apple ID
      node: 22
      xcode: latest
    triggering:
      events:
        - push
      branch_patterns:
        - pattern: main
      when:
        changeset:
          includes:
            - mobil/
          excludes:
            - mobil/**/*.md
    scripts:
      - name: Paketler
        script: cd mobil && npm ci
      - name: Capacitor eşitle
        script: cd mobil && npx cap sync ios
      - name: İmza profilleri
        script: xcode-project use-profiles
      - name: Derleme numarası (TestFlight'taki son + 1)
        script: |
          SON=$(app-store-connect get-latest-testflight-build-number "$APP_STORE_APPLE_ID" || echo 0)
          cd mobil/ios/App && agvtool new-version -all $(($SON + 1))
      - name: IPA derle
        script: xcode-project build-ipa --project "mobil/ios/App/App.xcodeproj" --scheme "App"
    artifacts:
      - build/ios/ipa/*.ipa
      - /tmp/xcodebuild_logs/*.log
    publishing:
      app_store_connect:
        auth: integration
        submit_to_testflight: true
        beta_groups:
          - Kulüp

  android-apk:
    name: Android → APK (linkle dağıtım)
    instance_type: linux_x2
    max_build_duration: 30
    environment:
      android_signing:
        - dag_keystore
      node: 22
      java: 21
    triggering:
      events:
        - push
      branch_patterns:
        - pattern: main
      when:
        changeset:
          includes:
            - mobil/
    scripts:
      - name: Paketler
        script: cd mobil && npm ci
      - name: Capacitor eşitle
        script: cd mobil && npx cap sync android
      - name: Sürüm numarası
        script: |
          cd mobil/android
          sed -i "s/versionCode [0-9]*/versionCode $BUILD_NUMBER/" app/build.gradle
      - name: APK derle
        script: cd mobil/android && chmod +x gradlew && ./gradlew assembleRelease
    artifacts:
      - mobil/android/app/build/outputs/apk/release/*.apk
